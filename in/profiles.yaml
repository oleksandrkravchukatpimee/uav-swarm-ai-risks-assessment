version: 1

P1:
  name: AI/ML-heavy
  description: Focus on uncertainty, calibration, confabulations, and model-related risks.

  stages: KA = TR > OP > KS

  factors:
    KS: H > T
    KA: T > H
    TR: T > H
    OP: T > H

  risks:
    KS:
      H:
        representativeness: high
        dataset_bias: high
        temporal_bias: medium
        scale_mismatch: medium
        limited_scene_diversity: medium

    KA:
      H:
        annotation_errors: medium
        inadequate_model_architecture: high
        lack_of_uncertainty_estimation: high
      T:
        feature_leakage: medium
        incorrect_spatial_geometric_interpretation: high

    TR:
      H:
        domain_shift: high
        incomplete_validation_criteria: high
      T:
        overfitting: medium
        confabulations: very_high
        confidence_miscalibration: very_high
        catastrophic_forgetting: low

    OP:
      H:
        loss_of_situational_awareness: medium
      T:
        sensor_artifacts: medium
        concept_drift: medium
        cascading_error_propagation: high

P2:
  name: Swarm/Ops-heavy
  description: Focus on operation-stage risks, coordination failures, and cascading effects in the swarm.

  stages: OP >> TR > KA > KS

  factors:
    KS: H > T
    KA: T > H
    TR: T > H
    OP: T >> H

  risks:
    KS:
      H:
        representativeness: medium
        dataset_bias: medium
        temporal_bias: low
        scale_mismatch: low
        limited_scene_diversity: low

    KA:
      H:
        annotation_errors: low
        inadequate_model_architecture: medium
        lack_of_uncertainty_estimation: medium
      T:
        feature_leakage: low
        incorrect_spatial_geometric_interpretation: medium

    TR:
      H:
        domain_shift: medium
        incomplete_validation_criteria: medium
      T:
        overfitting: medium
        confabulations: medium
        confidence_miscalibration: medium
        catastrophic_forgetting: low

    OP:
      H:
        loss_of_situational_awareness: high
      T:
        sensor_artifacts: high
        concept_drift: high
        cascading_error_propagation: very_high

P3:
  name: Balanced
  description: Balanced profile with moderate priorities across the lifecycle and risk groups.

  stages: OP > TR = KA > KS

  factors:
    KS: H = T
    KA: T = H
    TR: T = H
    OP: T > H

  risks:
    KS:
      H:
        representativeness: medium
        dataset_bias: medium
        temporal_bias: medium
        scale_mismatch: medium
        limited_scene_diversity: medium

    KA:
      H:
        annotation_errors: medium
        inadequate_model_architecture: medium
        lack_of_uncertainty_estimation: medium
      T:
        feature_leakage: medium
        incorrect_spatial_geometric_interpretation: medium

    TR:
      H:
        domain_shift: medium
        incomplete_validation_criteria: medium
      T:
        overfitting: medium
        confabulations: medium
        confidence_miscalibration: medium
        catastrophic_forgetting: low

    OP:
      H:
        loss_of_situational_awareness: medium
      T:
        sensor_artifacts: medium
        concept_drift: medium
        cascading_error_propagation: high

P4:
  name: Safety/Validation-heavy
  description: Focus on uncertainty handling, validation quality, safety constraints, and fallback behavior.

  stages: OP = TR = KA > KS

  factors:
    KS: H = T
    KA: T > H
    TR: T > H
    OP: T = H

  risks:
    KS:
      H:
        representativeness: medium
        dataset_bias: medium
        temporal_bias: medium
        scale_mismatch: low
        limited_scene_diversity: low

    KA:
      H:
        annotation_errors: medium
        inadequate_model_architecture: medium
        lack_of_uncertainty_estimation: very_high
      T:
        feature_leakage: low
        incorrect_spatial_geometric_interpretation: high

    TR:
      H:
        domain_shift: medium
        incomplete_validation_criteria: very_high
      T:
        overfitting: low
        confabulations: high
        confidence_miscalibration: very_high
        catastrophic_forgetting: low

    OP:
      H:
        loss_of_situational_awareness: high
      T:
        sensor_artifacts: medium
        concept_drift: medium
        cascading_error_propagation: high