# Document supports simple and clear structure of risk hierarchy
#
# "Stage X":
#  compare:
#    "Stage Y": Fyx       # Fyx > 0 means "Stage Y" is more important than "Stage X"
#  factors:
#    T:
#      compare:
#        H: Fht     # Fht < 0 means H is less important than T
#      risks: # empty
#
# Fab - importance factor, i.e. how risk A is more important than risk B
# when Fab = 0, risk A equals to risk B
# when Fab < 0, risk A is less important than risk B
# when Fab > 0, risk A is more important than risk B
KS:
  factors:
    H:
      risks:
        representativeness: {}
        dataset_bias:
          compare:
            representativeness: 1
        temporal_bias:
          compare:
            representativeness: 2
            dataset_bias: 2
        scale_mismatch:
          compare:
            representativeness: 2
            dataset_bias: 2
            temporal_bias: 1
        limited_scene_diversity:
          compare:
            representativeness: 3
            dataset_bias: 3
            temporal_bias: -2
            scale_mismatch: -2
KA:
  compare:
    KS: -2
  factors:
    H:
      risks:
        annotation_errors: {}
        inadequate_model_architecture:
          compare:
            annotation_errors: 0
        lack_of_uncertainty_estimation:
          compare:
            annotation_errors: 0
            inadequate_model_architecture: 0
    T:
      compare:
        H: 5
      risks:
        reliance_on_spurious_features: {}
        incorrect_spatial_geometric_interpretation:
          compare:
            reliance_on_spurious_features: 0

TR:
  compare:
    KS: -3
    KA: -2
  factors:
    H:
      risks:
        domain_shift:
        incomplete_validation_criteria:
          compare:
            domain_shift: -2
    T:
      compare:
        H: -3
      risks:
        overfitting:
        confabulations:
          compare:
            overfitting: -4
        confidence_miscalibration:
          compare:
            overfitting: 2
            confabulations: 5
        catastrophic_forgetting:
          compare:
            overfitting: -5
            confabulations: -3
            confidence_miscalibration: -7

OP:
  compare:
    KS: -3
    KA: -3
    TR: -4
  factors:
    H:
      risks:
        loss_of_situational_awareness:
    T:
      compare:
        H: -7
      risks:
        sensor_artifacts: {}
        concept_drift:
          compare:
            sensor_artifacts: 3
        cascading_error_propagation:
          compare:
            sensor_artifacts: -4
            concept_drift: -5
